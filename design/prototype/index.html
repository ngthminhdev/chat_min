/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.

@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-nowrap  { white-space: nowrap; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

<div class="app-frame">
  <header class="titlebar">
    <div class="traffic" aria-hidden="true"><i></i><i></i><i></i><span class="app-name">ChatMin</span></div>
    <button class="search" id="open-palette" type="button" aria-label="Mở command palette">
      <svg class="od-icon ic" aria-hidden="true"><use href="#i-search"/></svg>
      <span>Nhảy tới chat, người, lệnh…</span>
      <kbd>⌘K</kbd>
    </button>
    <div class="toolbar">
      <button class="tool-btn icon-only lg" id="btn-msg-search" type="button" aria-label="Tìm trong tin nhắn" data-tip="Tìm nội dung tin nhắn mọi account" data-kbd="⌘⇧F"><svg class="od-icon ic" aria-hidden="true"><use href="#i-message-square-text"/></svg></button>
      <details class="appearance-menu" id="appearance-menu">
      <summary class="tool-btn icon-only lg" aria-label="Giao diện" data-tip="Giao diện"><svg class="od-icon ic" aria-hidden="true"><use href="#i-palette"/></svg></summary>
      <div class="appearance-panel"><label for="theme-select">Giao diện</label>
      <select class="theme-select" id="theme-select" data-tip="Theme của design system">
        <option value="">Bearded Arc · dark</option>
        <option value="light">Min Light</option>
        <option value="tokyo-night">Tokyo Night</option>
        <option value="rose-pine">Rosé Pine</option>
        <option value="catppuccin-mocha">Catppuccin Mocha</option>
        <option value="soft-light">Soft Light</option>
      </select>
      <span>Áp dụng cho toàn bộ cửa sổ</span></div>
      </details>
      <button class="tool-btn icon-only lg" id="btn-add-account" type="button" aria-label="Thêm account" data-tip="Thêm account"><svg class="od-icon ic" aria-hidden="true"><use href="#i-user-plus"/></svg></button>
      <button class="tool-btn icon-only lg" id="btn-settings" type="button" aria-label="Settings" data-tip="Settings" data-kbd="⌘,"><svg class="od-icon ic" aria-hidden="true"><use href="#i-settings"/></svg></button>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar" id="sidebar" aria-label="Hội thoại"></aside>
    <div class="resize-handle vertical left" data-resize="left" role="separator" aria-orientation="vertical" aria-label="Kéo để đổi độ rộng sidebar"></div>
    <section class="workspace">
      <nav class="tabs" id="tabs" aria-label="Hội thoại đang mở"></nav>
      <div class="content" id="content"></div>
    </section>
    <div class="resize-handle vertical right" data-resize="right" role="separator" aria-orientation="vertical" aria-label="Kéo để đổi độ rộng inspector"></div>
    <aside class="inspector" id="inspector" aria-label="Thông tin chat"></aside>
  </main>

  <footer class="footer-shell">
    <button class="tool-btn panel-toggle active" id="btn-left" type="button" aria-label="Ẩn/hiện sidebar" aria-pressed="true" data-tip="Sidebar" data-kbd="⌘B"><svg class="od-icon ic" aria-hidden="true"><use href="#i-panel-left"/></svg></button>
    <div class="statusbar" id="statusbar"></div>
    <button class="tool-btn panel-toggle active" id="btn-right" type="button" aria-label="Ẩn/hiện inspector" aria-pressed="true" data-tip="Inspector" data-kbd="⌘I"><svg class="od-icon ic" aria-hidden="true"><use href="#i-panel-right"/></svg></button>
  </footer>
</div>

<div id="overlay-root"></div>
<div class="tip" id="tip" role="tooltip"></div>
<input type="file" id="file-input" hidden />

<script src="app.js"></script>
<script src="round2.js"></script>
</body>
</html>
